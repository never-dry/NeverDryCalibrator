# The name and description of every service and field live in strings.json and in
# translations/, never here. Home Assistant reads them from the translation of the
# user's language, so a copy in this file would be a second English original: it
# can drift from the translated one, and nothing would catch the drift.
#
# What stays here is what has no language: which fields exist, whether they are
# required, their selector and an example value.

calibrate_now:
  fields:
    probe:
      required: false
      example: "Ortensia"
      selector:
        text:

reset_calibration:
  fields:
    probe:
      required: true
      example: "Ortensia"
      selector:
        text:

mark_field_capacity:
  fields:
    probe:
      required: true
      example: "Ortensia"
      selector:
        text:

apply_device_offset:
  fields:
    probe:
      required: true
      example: "Ortensia"
      selector:
        text:
    offset:
      required: false
      selector:
        number:
          min: -50
          max: 50
          step: 0.1
          mode: box

export_samples:
  fields:
    probe:
      required: false
      example: "Ortensia"
      selector:
        text:
